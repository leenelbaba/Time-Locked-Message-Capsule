[package]
name = "drand-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Minimal async client for the League of Entropy drand randomness beacon (unchained BLS schemes), with signature verification, round/time conversion and in-memory caching."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
bls12_381_plus = "0.8"
group = "0.13"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
