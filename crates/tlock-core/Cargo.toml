[package]
name = "tlock-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Timelock (tlock) encryption: Boneh-Franklin identity-based encryption over a drand beacon's future rounds, wrapped around AES-256-GCM for arbitrary-size payloads."

[dependencies]
drand-client = { path = "../drand-client" }
bls12_381_plus = "0.8"
group = "0.13"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
